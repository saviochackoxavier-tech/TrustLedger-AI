{% comment %}
TrustLedger AI — Dark error page.
Used for browser navigations that hit a refused state (405/409/502) so the
user never sees a raw JSON body on a blank white page.
{% endcomment %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustLedger AI — {{ status }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23ecfdf5'%3E%E2%9A%96%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    .glass { background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(14px); }
    .grid-aura {
      background-image: radial-gradient(circle at 15% 10%, rgba(16,185,129,.10), transparent 42%),
                        radial-gradient(circle at 85% 90%, rgba(99,102,241,.10), transparent 42%);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans grid-aura antialiased flex items-center justify-center p-5">
  <main class="w-full max-w-md glass rounded-2xl border border-slate-700 p-7 text-center">
    <div class="h-11 w-11 mx-auto rounded-xl bg-amber-500/10 border border-amber-400/40 flex items-center justify-center">
      <i class="fa-solid fa-shield-halved text-amber-400"></i>
    </div>
    <p class="mt-4 text-[11px] font-mono uppercase tracking-widest text-slate-500">HTTP {{ status }}</p>
    <h1 class="mt-1 text-lg font-semibold">Action not completed</h1>
    <p class="mt-2 text-sm text-slate-400 break-words">{{ message }}</p>
    <a href="{% url 'trustledger:dashboard' %}"
       class="mt-6 inline-flex items-center gap-2 rounded-xl bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400 transition">
      <i class="fa-solid fa-arrow-left"></i> Back to vaults
    </a>
  </main>
</body>
</html>
